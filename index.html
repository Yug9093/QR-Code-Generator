<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Code Generator</title>
  <meta name="description" content="Generate customizable QR codes from text or URLs. Choose colors, size, and error correction; download as PNG." />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>QR Code Generator</h1>
    <button id="theme-toggle" aria-label="Toggle theme">🌓</button>
  </header>

  <main class="app-main">
    <section class="controls">
      <label>
        Enter text or URL
        <input type="text" id="qr-input" placeholder="https://example.com" />
      </label>

      <label>
        Size
        <input type="number" id="qr-size" min="100" max="500" value="250" />
      </label>

      <div class="color">
        <label>
          Color
          <input type="color" id="qr-color" value="#069494" />
        </label>

        <label>
          Background
          <input type="color" id="qr-bg" value="#ffffff" />
        </label>
      </div>

      <button id="generate">Generate QR</button>
    </section>

    <section class="preview">
      <div id="qr-code"></div>
      <button id="download" disabled>Download PNG</button>
    </section>
  </main>

  <footer class="app-footer">
    <p>Made By <strong>Yug Patel</strong></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
  const input = document.getElementById("qr-input");
  const sizeInput = document.getElementById("qr-size");
  const colorInput = document.getElementById("qr-color");
  const bgInput = document.getElementById("qr-bg");
  const qrContainer = document.getElementById("qr-code");
  const generateBtn = document.getElementById("generate");
  const downloadBtn = document.getElementById("download");
  const themeToggle = document.getElementById("theme-toggle");

  generateBtn.addEventListener("click", () => {
    const text = input.value.trim();
    if (!text) return alert("Please enter text or URL");

    qrContainer.innerHTML = "";

    // Create a canvas and append it
    const canvas = document.createElement("canvas");
    qrContainer.appendChild(canvas);

    // Generate QR with colors
    QRCode.toCanvas(canvas, text, {
      width: parseInt(sizeInput.value),
      color: {
        dark: colorInput.value,   // foreground color
        light: bgInput.value      // background color
      }
    }, (err) => {
      if (err) return console.error(err);
      downloadBtn.disabled = false;
    });
  });

  downloadBtn.addEventListener("click", () => {
    const canvas = qrContainer.querySelector("canvas");
    if (!canvas) return;
    const link = document.createElement("a");
    link.download = "qr-code.png";
    link.href = canvas.toDataURL();
    link.click();
  });

  themeToggle.addEventListener("click", () => {
    document.documentElement.dataset.theme =
      document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  });
</script>

</body>
</html>
